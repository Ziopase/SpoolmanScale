name: Build firmware (Brother QL)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Prepare the platform's Python environment
        run: |
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/pip install "pioarduino==6.2.0"
      - name: Build
        run: pio run -e wt32-sc01-plus
      - name: Collect the files
        run: |
          mkdir out
          cp .pio/build/wt32-sc01-plus/firmware.bin   out/SpoolmanScale-QL.bin
          cp .pio/build/wt32-sc01-plus/bootloader.bin out/bootloader.bin
          cp .pio/build/wt32-sc01-plus/partitions.bin out/partitions.bin
      - uses: actions/upload-artifact@v4
        with:
          name: SpoolmanScale-QL
          path: out/